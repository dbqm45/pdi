<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap">
<style>
body{margin:0}
.pn a{text-decoration:none}
.pn a:hover{background:#f0f0f2}
</style>
</helmet>
<nav class="pn" aria-label="Main" style="width: 100%; min-height: 960px; box-sizing: border-box; padding: 14px 12px; background: #fafafa; border-right: 1px solid #ececee; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; color: #18181b; display: flex; flex-direction: column; gap: 2px">
  <div style="display: flex; align-items: center; gap: 10px; padding: 6px 8px 14px">
    <span aria-hidden="true" style="width: 28px; height: 28px; border-radius: 8px; background: #18181b; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14px">S</span>
    <span style="display: flex; flex-direction: column; line-height: 1.2; flex-grow: 1">
      <span style="font-weight: 600; font-size: 14px">Sprintdeck</span>
      <span style="font-size: 12px; color: #71717a">Product workspace</span>
    </span>
    <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"></path></svg>
  </div>

  <sc-for list="{{items}}" as="it" hint-placeholder-count="9">
    <sc-if value="{{it.group}}" hint-placeholder-val="{{false}}">
      <div style="font-size: 12px; font-weight: 500; color: #71717a; padding: 14px 10px 6px">{{it.group}}</div>
    </sc-if>
    <a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="{{it.icon}}"></path></svg>
      <span style="flex-grow: 1">{{it.label}}</span>
      <sc-if value="{{it.badge}}" hint-placeholder-val="{{false}}">
        <span style="{{it.badgeStyle}}">{{it.badge}}</span>
      </sc-if>
    </a>
  </sc-for>

  <div style="flex-grow: 1"></div>
  <div style="border: 1px solid #ececee; background: #FFFFFF; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px">
    <span style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600">
      <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: #12b76a"></span>All systems connected
    </span>
    <span style="font-size: 12px; color: #71717a">pdi · tf · ci_for_sdlc · ShipScope</span>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 8px">
    <span aria-hidden="true" style="width: 32px; height: 32px; border-radius: 50%; background: #e0e7ff; color: #3730a3; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 12px">AK</span>
    <span style="display: flex; flex-direction: column; line-height: 1.25">
      <span style="font-size: 13px; font-weight: 600">Anna Kowal</span>
      <span style="font-size: 12px; color: #71717a">Product owner</span>
    </span>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["overview","changes","problems","features","releases","consistency","outcomes","decisions"],"default":"overview"},"$preview":{"width":240,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'overview';
    const I = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      branch: 'M3.5 6a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M3.5 18a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M15.5 8a2.5 2.5 0 1 0 5 0a2.5 2.5 0 1 0-5 0M6 8.5v7M18 10.5c0 4-6 3-11 5.5',
      msg: 'M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z',
      box: 'M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8',
      layers: 'm12 2 10 5-10 5L2 7zM2 17l10 5 10-5M2 12l10 5 10-5',
      shield: 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6zM9 12l2 2 4-4',
      chart: 'M3 3v18h18M7 15l4-4 3 3 5-6',
      scale: 'M12 3v18M7 21h10M5 7h14M5 7l-3 7a3 3 0 0 0 6 0zM19 7l-3 7a3 3 0 0 0 6 0z',
    };
    const base = 'display: flex; align-items: center; gap: 10px; min-height: 36px; box-sizing: border-box; padding: 6px 10px; border-radius: 8px; font-size: 14px; ';
    const mk = (id, label, icon, href, extra) => {
      const on = id === active;
      return Object.assign({
        label, href, icon: I[icon], group: '', badge: '', current: on ? 'page' : 'false',
        style: base + (on ? 'background: #FFFFFF; color: #18181b; font-weight: 600; box-shadow: 0 0 0 1px #ececee, 0 1px 2px rgba(24,24,27,.06);' : 'color: #52525b; font-weight: 500;'),
        badgeStyle: 'font-size: 12px; font-weight: 600; min-width: 20px; text-align: center; padding: 1px 7px; border-radius: 999px; ' + (extra && extra.hot ? 'background: #fef4d4; color: #8a5a00;' : 'background: #f0f0f2; color: #52525b;'),
      }, extra || {});
    };
    return {
      items: [
        mk('overview', 'Overview', 'home', 'ProDashboard.dc.html'),
        mk('changes', 'My changes', 'branch', 'ProZmiany.dc.html', { badge: '3', hot: true }),
        mk('problems', 'Problems', 'msg', 'Problemy.dc.html', { badge: '2' }),
        mk('features', 'Features', 'box', 'Produkt.dc.html', { group: 'Product' }),
        mk('releases', 'Releases', 'layers', 'Wydania.dc.html'),
        mk('consistency', 'Consistency', 'shield', 'Spojnosc.dc.html', { group: 'Insight' }),
        mk('outcomes', 'Outcomes', 'chart', '#outcomes'),
        mk('decisions', 'Decisions', 'scale', '#decisions'),
      ],
    };
  }
}
</script>
</body>
</html>
