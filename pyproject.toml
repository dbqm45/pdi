[project]
name = "pdi"
version = "0.7.0"
description = "pdi — rejestr decyzji z zapisem tam, gdzie decyzje zapadają (serwer MCP)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "pyyaml>=6",
    "jsonschema>=4.23",
    "typing-extensions>=4.12",
]

[project.scripts]
pdi-mcp = "pdi.mcp_server:main"
pdi-stats = "pdi.stats:main"
pdi-receiver = "pdi.receiver:main"
pdi-impact-review = "pdi.impact:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pdi"]

[dependency-groups]
dev = [
    "pytest>=9",
    "anyio>=4",
    "ruff>=0.16",
    "mypy>=2.3",
    "types-pyyaml",
    "types-jsonschema",
]

[tool.pytest]
minversion = "9.0"
strict = true
testpaths = ["tests"]
addopts = ["-ra", "--import-mode=importlib"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.11"
